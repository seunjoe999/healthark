# ── HTTP: redirect to HTTPS + serve certbot challenge ────────────────────
server {
    listen 80;
    server_name compcarehub.co.uk www.compcarehub.co.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://compcarehub.co.uk$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name compcarehub.co.uk www.compcarehub.co.uk;

    ssl_certificate     /etc/letsencrypt/live/compcarehub.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/compcarehub.co.uk/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Redirect www to apex
    if ($host = www.compcarehub.co.uk) {
        return 301 https://compcarehub.co.uk$request_uri;
    }

    # Upload & request size
    client_max_body_size 50M;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy to Node app
    location / {
        proxy_pass         http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
