name: Build & Push Docker Image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 163.245.223.58
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/healthark
            # Keep the deploy config (docker-compose.yml, nginx/) in sync with the repo
            git pull --ff-only || true
            # Pull the freshly built image and (re)start the stack.
            # nginx (in the compose file) proxies to the app on port 3001 and
            # serves 80/443, so we bring up the whole stack rather than a bare
            # `docker run` (which used the wrong port and network).
            docker compose pull app
            docker compose up -d
            docker image prune -f
