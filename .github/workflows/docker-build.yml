name: Build & Push Docker Image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend test suite
        run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: 163.245.223.58
          port: 22
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          envs: DEPLOY_SMTP_PASS,DEPLOY_SMTP_FROM,DEPLOY_GROQ_API_KEY
          script: |
            set -e
            # Keep /opt/healthark/.env's secrets in sync with the GitHub secrets on
            # every deploy, so credentials never depend on someone having manually
            # edited a file on this server — this is the only place they get written.
            if [ -n "$DEPLOY_SMTP_PASS" ]; then
              grep -q '^SMTP_PASS=' /opt/healthark/.env 2>/dev/null \
                && sed -i "s|^SMTP_PASS=.*|SMTP_PASS=${DEPLOY_SMTP_PASS}|" /opt/healthark/.env \
                || echo "SMTP_PASS=${DEPLOY_SMTP_PASS}" >> /opt/healthark/.env
              grep -q '^SMTP_FROM=' /opt/healthark/.env 2>/dev/null \
                && sed -i "s|^SMTP_FROM=.*|SMTP_FROM=${DEPLOY_SMTP_FROM}|" /opt/healthark/.env \
                || echo "SMTP_FROM=${DEPLOY_SMTP_FROM}" >> /opt/healthark/.env
            fi
            if [ -n "$DEPLOY_GROQ_API_KEY" ]; then
              grep -q '^GROQ_API_KEY=' /opt/healthark/.env 2>/dev/null \
                && sed -i "s|^GROQ_API_KEY=.*|GROQ_API_KEY=${DEPLOY_GROQ_API_KEY}|" /opt/healthark/.env \
                || echo "GROQ_API_KEY=${DEPLOY_GROQ_API_KEY}" >> /opt/healthark/.env
            fi
            docker pull ghcr.io/seunjoe999/healthark:latest
            docker stop healthark_app || true
            docker rm healthark_app || true
            docker run -d --name healthark_app --restart always --network host --env-file /opt/healthark/.env -v healthark_uploads:/app/backend/uploads ghcr.io/seunjoe999/healthark:latest
            docker image prune -f
            echo "Deploy complete"
        env:
          DEPLOY_SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DEPLOY_SMTP_FROM: ${{ secrets.SMTP_FROM }}
          DEPLOY_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
