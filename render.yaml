services:
  - type: web
    name: compcarehub
    env: node
    region: oregon
    plan: free
    buildCommand: rm -rf frontend/dist && rm -rf backend/dist && npm run build
    startCommand: cd backend && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: compcarehub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: PORT
        value: 3001
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: compcarehub-db
    databaseName: healthark
    user: healthark_user
    plan: free
    region: oregon
