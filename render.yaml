services:
  - type: static
    name: compcare-website
    rootDir: website
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: compcarehub
    env: node
    region: oregon
    plan: free
    buildCommand: NODE_OPTIONS="--max-old-space-size=460" npm run build
    startCommand: node backend/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: compcarehub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: PORT
        value: 3001
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://compcarehub.onrender.com

databases:
  - name: compcarehub-db
    databaseName: healthark
    user: healthark_user
    plan: free
    region: oregon
