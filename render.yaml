services:
  # ── Main app: app.comprehensivecare.org.uk ─────────────────────────────────
  - type: web
    name: compcarehub
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install --include=dev && npm run build
    startCommand: node backend/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: compcarehub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: PORT
        value: 3001
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://app.comprehensivecare.org.uk,https://comprehensivecare.org.uk

  # ── Landing page: comprehensivecare.org.uk ─────────────────────────────────
  - type: web
    name: compcarehub-landing
    env: static
    staticPublishPath: ./landing
    buildCommand: ""
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /*
        name: Pragma
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: compcarehub-db
    databaseName: healthark
    user: healthark_user
    plan: free
    region: oregon
